name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A second push to a pull request supersedes the first, so cancel the run it
# replaced. Pushes to main key on the commit, so each gets its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Claude Code engine that validates and tests the plugin. Bump on purpose.
  CLAUDE_CODE_VERSION: 2.1.326

jobs:
  # Everything that reads the tree without running the plugin: workflow lint,
  # workflow security, hash pins, and secrets over the whole history.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks reads pull request metadata to report what it finds.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history, not the working tree.
          fetch-depth: 0
          persist-credentials: false

      - name: lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: audit workflows
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false

      # Every `uses:` must be a full commit SHA that matches its version
      # comment. fix: "false" only checks; it never rewrites a workflow.
      - name: verify actions are pinned
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"
          verify: "true"

      # The site draws the pane with the plugin's own drawing code. A stale copy
      # shows an old pane, so the copy must match a fresh build of the source.
      - name: site drawing code matches the plugin
        run: |
          node site/build.mjs
          git diff --exit-code -- site/vendor/bars.js || { echo "site/vendor/bars.js is stale: run node site/build.mjs" >&2; exit 1; }

      - name: secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The plugin's own checks, with the engine's own commands: the manifest and
  # what the hooks call through `claude plugin validate`, and the test files
  # through `claude plugin test`. Neither needs a login. Neither type-checks:
  # the engine's types come only with a loaded copy, so the type-check runs in
  # scripts/check.sh before each pull request.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The engine is a tool, not a dependency of the plugin, so it has no
      # lockfile here; its exact version is pinned in CLAUDE_CODE_VERSION.
      - name: install the engine
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # zizmor: ignore[adhoc-packages]
      - name: validate
        run: claude plugin validate plugins/mission-status
      - name: test
        run: claude plugin test plugins/mission-status

  # A pull request that changes the plugin must raise its version: every merged
  # plugin change is a release. Other events have nothing to compare.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the plugin version moves with the plugin
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-version.sh "${BASE}" "${HEAD}"

  # The one context the branch ruleset requires. It exists on every run and
  # fails unless every job it needs succeeded, so a skipped or cancelled job
  # can never pass for green.
  ci:
    needs: [checks, test, version]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
