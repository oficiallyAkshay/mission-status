# Keeps a lifetime clone and view count on the `badges` branch.
# Needs the repository secret TRAFFIC_TOKEN: a fine-grained token on this
# repository only, Administration read and Contents write. Until it exists,
# each run skips the count and passes, so no tick fails.
# GitHub disables a scheduled workflow after 60 days with no commit to the
# repository; any commit, on any branch, resets that clock.
name: clonometer
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {}
concurrency: {group: clonometer}
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      HAS_TOKEN: ${{ secrets.TRAFFIC_TOKEN != '' }}
    steps:
      - name: no token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "TRAFFIC_TOKEN is not set; skipping the count."
      - if: env.HAS_TOKEN == 'true'
        uses: oficiallyAkshay/clonometer@b1cc1b48ac9a6a38ae505cf060a0a1de82682413 # v1.2.0
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          runs-per-day: ${{ vars.CLONOMETER_RUNS_PER_DAY }}
          metrics: clones,views
